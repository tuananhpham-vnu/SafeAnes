[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeanes-uc04"
version = "0.2.0"
description = "Research pipeline for intraoperative hypotension prediction"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2"]

[project.optional-dependencies]
boosting = ["lightgbm>=4.3,<5"]
catboost = ["catboost>=1.2.10,<2"]
deep = ["torch>=2.6,<3", "scipy>=1.11,<2"]
tabular = ["torch>=2.6,<3", "tabm==0.0.3", "rtdl_num_embeddings==0.0.12", "lightgbm>=4.3,<5"]
plots = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10"]

[project.scripts]
safeanes = "safeanes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
