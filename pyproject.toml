[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeanes-uc04"
version = "0.2.0"
description = "Research pipeline for intraoperative hypotension prediction"
requires-python = ">=3.11"
dynamic = ["dependencies"]  # from requirements.txt (the only list of dependencies)

[project.scripts]
safeanes = "safeanes.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
